[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-storage-demo"
version = "0.1.0"
description = "A small Python demo for ontology-aware data storage on SQLite."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cursor Agent" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
